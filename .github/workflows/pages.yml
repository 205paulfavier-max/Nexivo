name: Deploiement GitHub Pages

# Construit l application et la publie sur GitHub Pages a chaque
# mise a jour de la branche par defaut.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, sans annuler celui en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4

      - name: Installation de Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installation des dependances
        run: npm ci

      - name: Build de production
        run: npm run build

      - name: Configuration de Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Envoi de l artefact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Deploiement vers Pages
        id: deploiement
        uses: actions/deploy-pages@v4
